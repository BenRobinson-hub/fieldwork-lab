# GC02 Fieldwork LAB RC2 - P1 CANDIDATE / PR QUALITY GATE ONLY
# ZERO deployment, ZERO PR creation/merge, ZERO Pages mutation, read-only token.
# This does not by itself enforce branch protection or control Pages source.
name: Fieldwork RC2 candidate and PR QA (no deployment)

on:
  push:
    branches:
      - gc02-rc2-controlled-release-candidate
    paths:
      - '.github/workflows/fieldwork-controlled-pages.yml'
      - 'qa/**'
      - 'assets/**'
      - 'evidence/**'
      - 'investigations/**'
      - 'index.html'
      - 'notes.html'
      - '.nojekyll'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: fieldwork-rc2-p1-qa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: rc2-release-quality
    if: github.repository == 'BenRobinson-hub/fieldwork-lab'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out triggering candidate or PR merge commit
        uses: actions/checkout@v4
      - name: Validate event, provenance and frozen main base
        shell: bash
        env:
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo 'STOP_CHECKOUT_IDENTITY_MISMATCH' >&2; exit 31; }
          if [[ "$GITHUB_EVENT_NAME" == 'push' ]]; then
            [[ "$GITHUB_REF" == 'refs/heads/gc02-rc2-controlled-release-candidate' ]] || { echo 'STOP_NON_CANDIDATE_PUSH' >&2; exit 32; }
          elif [[ "$GITHUB_EVENT_NAME" == 'pull_request' ]]; then
            [[ "$PR_HEAD_REPO" == 'BenRobinson-hub/fieldwork-lab' ]] || { echo 'STOP_WRONG_HEAD_REPOSITORY' >&2; exit 33; }
            [[ "$PR_HEAD_REF" == 'gc02-rc2-controlled-release-candidate' ]] || { echo 'STOP_WRONG_HEAD_BRANCH' >&2; exit 34; }
            [[ "$PR_BASE_REF" == 'main' ]] || { echo 'STOP_WRONG_BASE_BRANCH' >&2; exit 35; }
            [[ "$PR_BASE_SHA" == '4b2186c8157281752145147e2cc998ec6c577fee' ]] || { echo 'STOP_MAIN_BASELINE_DRIFT' >&2; exit 36; }
          else
            echo 'STOP_UNEXPECTED_EVENT' >&2
            exit 37
          fi
      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser runtime for real HTTP gate
        run: |
          python -m pip install --disable-pip-version-check 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Stage ONLY the nine public site files
        run: python qa/build_public.py --source . --dest ../fieldwork-qa-stage --manifest qa/approved_rc2.json
      - name: Exact source and real HTTP browser checks
        run: python qa/site_gate.py --site ../fieldwork-qa-stage --manifest qa/approved_rc2.json --runtime http --out /tmp/fieldwork-qa-checks.json
      - name: Negative controls must fail closed
        run: python qa/selftest_negative.py --site ../fieldwork-qa-stage --manifest qa/approved_rc2.json --out /tmp/fieldwork-qa-negatives.json
      - name: Retain machine-readable QA evidence (no deployment)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fieldwork-p1-pr-qa-evidence
          path: |
            /tmp/fieldwork-qa-checks.json
            /tmp/fieldwork-qa-negatives.json
          if-no-files-found: warn
